    <title>دفتر الحسابات</title>
    <script>
      // Ultra-fast data preloading: Start fetching while React is still downloading
      window.__PRELOADED_DATA__ = (function() {
        const fetchJSON = url => fetch(url).then(r => r.json()).catch(() => ({ ok: false }));
        return {
          ledgers: fetchJSON('/api/admin/ledger-state'),
          history: fetchJSON('/api/admin/history'),
          abdalalem: fetchJSON('/api/admin/abdalalem-ledger')
        };
      })();
    </script>

    <script type="module" crossorigin src="./assets/index-CVOqyNKs.js"></script>

  <style>
    body { background: #0b0e12; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    #root-loading {
      position: fixed; inset: 0; background: #0b0e12; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 9999; color: white;
    }
    .spinner {
      width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #f43f5e;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #94a3b8; font-family: 'Changa', sans-serif; }
  </style>
  <body>
    <div id="root">
      <div id="root-loading">
        <div class="spinner"></div>
        <div class="loading-text">جاري تحميل دفتر الحسابات...</div>
      </div>
    </div>
  </body>
